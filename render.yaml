services:
  # FastAPI Backend Web Service (Free Tier)
  - type: web
    name: ai-code-reviewer-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://ai-code-reviewer-ui-eq6s.onrender.com"]'
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true

  # React Vite Frontend Static Site (Free Tier)
  - type: web
    name: ai-code-reviewer-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://ai-code-reviewer-api-z7hr.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

