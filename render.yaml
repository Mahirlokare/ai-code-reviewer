services:
  # FastAPI Backend Web Service (Free Tier)
  - type: web
    name: ai-code-reviewer-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true

  # React Vite Frontend (Free Static Site)
  - type: web
    name: ai-code-reviewer-ui
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: ai-code-reviewer-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
